<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body id="page-body">
    <header class="page-header" id="main-header">
        <h1>Kec Shopping</h1>

        <div class="search-container">
            <input type="text" placeholder="Search for a product" id="search-input">
            <button onclick="searchItems()">🔍</button>
        </div>

        <div class="buttons-container">
            <button id="theme-toggle" onclick="toggleTheme()">🌙</button>
            <button onclick="displayCart()">🛒</button>
        </div>

    </header>

    <navbar class="page-nav">
        <span onclick="loadWebsite()"> Home </span>
        <span onclick="renderCategory('mobiles')"> Mobile </span>
        <span onclick="renderCategory('fashion')"> fashion </span>
        <span onclick="renderCategory('toys')"> toys </span>
        <span onclick="renderCategory('electronics')"> electronics </span>
        <span onclick="renderCategory('books')"> books </span>
    </navbar>


    <main class="main-block">
        <h1 id="products-identifier"></h1>
        <div class="products-container" id="products-container">

        </div>
    </main>

    <footer class="page-footer">Footer</footer>
    <script src="./scripts/script.js"></script>
    <script>
        (function () { if (!window.chatbase || window.chatbase("getState") !== "initialized") { window.chatbase = (...arguments) => { if (!window.chatbase.q) { window.chatbase.q = [] } window.chatbase.q.push(arguments) }; window.chatbase = new Proxy(window.chatbase, { get(target, prop) { if (prop === "q") { return target.q } return (...args) => target(prop, ...args) } }) } const onLoad = function () { const script = document.createElement("script"); script.src = "https://www.chatbase.co/embed.min.js"; script.id = "enYTnBZnDkqq7oS17TQlV"; script.domain = "www.chatbase.co"; document.body.appendChild(script) }; if (document.readyState === "complete") { onLoad() } else { window.addEventListener("load", onLoad) } })();

</body>
</html>
